<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menfess Angel 💌</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font-family: system-ui, -apple-system, sans-serif;
    background:#7c3aed; background:linear-gradient(180deg,#8b5cf6,#6d28d9);
    min-height:100vh; display:flex; justify-content:center; padding:16px;
    color:#1f2937;
  }
  .card{
    background:#fff; width:100%; max-width:420px; height:fit-content;
    border-radius:24px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  h1{text-align:center; margin:0 0 4px; font-size:24px}
  p.sub{text-align:center; margin:0 0 18px; color:#6b7280; font-size:13px}
  label{font-weight:700; font-size:13px; display:block; margin:14px 0 6px}
  input, textarea{
    width:100%; padding:12px 14px; border:2px solid #e5e7eb; border-radius:14px;
    font-size:15px; outline:none; font-family:inherit; background:#f9fafb;
  }
  input:focus, textarea:focus{border-color:#8b5cf6; background:#fff}
  textarea{min-height:130px; resize:vertical}
  .row{display:flex; gap:10px; margin-top:14px}
  .check{
    flex:1; display:flex; align-items:center; gap:8px;
    border:2px solid #e5e7eb; border-radius:14px; padding:11px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .check.active{border-color:#8b5cf6; background:#f5f3ff}
  .check input{width:18px; height:18px; accent-color:#8b5cf6}
  button#kirim{
    width:100%; margin-top:16px; padding:14px; border:0; border-radius:14px;
    background:#7c3aed; color:#fff; font-size:16px; font-weight:800; cursor:pointer;
  }
  button#kirim:disabled{opacity:.6}
  #msg{text-align:center; margin-top:12px; font-size:14px; font-weight:600; display:none}
  .footer{text-align:center; margin-top:14px; font-size:12px; color:#9ca3af}
  .footer a{color:#7c3aed; text-decoration:none; font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>💌 Menfess Angel</h1>
  <p class="sub">Kirim menfess anonim, 100% rahasia<br>#jogjalend</p>

  <label>Username X / IG kamu (opsional)</label>
  <input id="username" placeholder="@username kamu - boleh kosong">

  <label>Isi Menfess *</label>
  <textarea id="content" placeholder="Tulis menfess kamu di sini... curhat, crush, confession, apa aja!"></textarea>

  <div class="row">
    <label class="check active" id="boxX">
      <input type="checkbox" id="toX" checked> Post ke X juga
    </label>
    <label class="check" id="boxAnon">
      <input type="checkbox" id="anon" checked> Anonim
    </label>
  </div>

  <button id="kirim" onclick="kirim()">✨ Kirim Menfess</button>
  <div id="msg"></div>

  <div class="footer">
    Lihat menfess di <a href="https://t.me/menfessangel" target="_blank">@menfessangel</a><br>
    & <a href="https://x.com/jogcorp" target="_blank">@jogcorp</a>
  </div>
</div>

<script>
  // === FIX MINI APP TELEGRAM ===
  if (window.Telegram && Telegram.WebApp) {
    try {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      Telegram.WebApp.setHeaderColor('#7c3aed');
      Telegram.WebApp.setBackgroundColor('#7c3aed');
      // Biar gak bisa di-swipe tutup pas ngetik
      Telegram.WebApp.disableVerticalSwipes();
    } catch(e){}
  }

  // Toggle visual checkbox
  document.getElementById('toX').addEventListener('change', e => {
    document.getElementById('boxX').classList.toggle('active', e.target.checked);
  });
  document.getElementById('anon').addEventListener('change', e => {
    document.getElementById('boxAnon').classList.toggle('active', e.target.checked);
  });

  async function kirim(){
    const username = document.getElementById('username').value.trim();
    const content = document.getElementById('content').value.trim();
    const toX = document.getElementById('toX').checked;
    const anon = document.getElementById('anon').checked;
    const btn = document.getElementById('kirim');
    const msg = document.getElementById('msg');

    if(!content){
      msg.style.display='block'; msg.style.color='red';
      msg.innerText='Isi menfess-nya dulu dong 🥺';
      return;
    }

    btn.disabled = true; btn.innerText = 'Mengirim...';
    msg.style.display='block'; msg.style.color='#6b7280';
    msg.innerText='Mengirim...';

    try{
      const res = await fetch('/submit_web', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, content, toX, anon })
      });
      const data = await res.json();
      if(data.ok){
        msg.style.color='green';
        msg.innerText='✅ Terkirim! Menunggu approval admin 💌';
        document.getElementById('content').value='';
        if(window.Telegram && Telegram.WebApp){
          Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }
      } else {
        msg.style.color='red';
        msg.innerText='❌ Gagal: '+(data.error||'coba lagi');
      }
    }catch(e){
      msg.style.color='red';
      msg.innerText='❌ Gagal konek ke server, coba lagi';
    }
    btn.disabled=false; btn.innerText='✨ Kirim Menfess';
  }
</script>
</body>
</html>
