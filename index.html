<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menfess Angel - Kirim Promote</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #fff; display: flex; justify-content: center; padding: 20px 12px; }
  .card { width: 100%; max-width: 420px; border: 1px solid #333; border-radius: 22px; padding: 24px 18px; background: #0a0a0a; }
  h1 { text-align: center; font-size: 28px; letter-spacing: 0.5px; }
  .subtitle { text-align: center; color: #ccc; font-size: 15px; margin-top: 8px; line-height: 1.5; }
  label { display: block; margin: 22px 0 8px; font-weight: 600; font-size: 16px; }
  input, textarea { width: 100%; background: #000; border: 1px solid #444; border-radius: 14px; color: #fff; padding: 14px; font-size: 15px; outline: none; }
  textarea { min-height: 110px; resize: vertical; }
  .file-box { border: 1.5px dashed #888; border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; font-size: 15px; }
  .file-box input { display: none; }
  .hint { text-align: center; color: #888; font-size: 13px; margin-top: 8px; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .row a { flex: 1; text-align: center; text-decoration: none; color: #fff; border: 1px solid #444; border-radius: 14px; padding: 12px; font-size: 15px; }
  #preview { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
  button.submit { width: 100%; margin-top: 14px; background: #e8e8e8; color: #000; border: none; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 700; cursor: pointer; }
  #status { text-align: center; margin-top: 12px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<div class="card">
  <h1>💌 Menfess Angel</h1>
  <div class="subtitle">
    Promote jasa & konten kamu disini.<br>#jogjalend
  </div>

  <label>Username Telegram kamu</label>
  <input id="username" placeholder="@username" />

  <label>Foto Promote *</label>
  <label class="file-box" for="photo">📷 Pilih Foto / Poster Promote
    <input type="file" id="photo" accept="image/*" />
  </label>
  <div class="hint">PNG, JPG maks 5MB</div>
  <img id="preview" />

  <label>Deskripsi *</label>
  <textarea id="content" placeholder="Tulis deskripsi promote kamu di sini..."></textarea>

  <div class="row">
    <a href="https://t.me/menfessangel" target="_blank">📣 Channel</a>
    <a href="https://t.me/essangel" target="_blank">✈️ Hubungi Admin</a>
  </div>

  <button class="submit" onclick="kirim()">✨ Kirim Promote</button>
  <div id="status"></div>
</div>

<script>
  const photoInput = document.getElementById('photo');
  const preview = document.getElementById('preview');
  photoInput.addEventListener('change', () => {
    const f = photoInput.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
    r.readAsDataURL(f);
  });

  async function kirim() {
    const username = document.getElementById('username').value.trim();
    const content = document.getElementById('content').value.trim();
    const file = photoInput.files[0];
    const status = document.getElementById('status');
    if (!content || !file) { status.textContent = 'Foto & deskripsi wajib diisi'; return; }
    status.textContent = 'Mengirim...';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const res = await fetch('/submit_web', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, content, photo: reader.result })
        });
        const j = await res.json();
        if (j.ok) { status.textContent = '✅ Terkirim! Menunggu approve admin.'; }
        else { status.textContent = '❌ ' + (j.error || 'Gagal'); }
      } catch(e) { status.textContent = '❌ Gagal konek ke server'; }
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
