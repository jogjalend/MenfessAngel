<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menfess Angel - Kirim Menfess</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f12;color:#fff;min-height:100vh;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:520px;background:#1a1a1f;border-radius:20px;padding:24px;border:1px solid #2a2a30}
h1{font-size:28px;background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#a1a1aa;margin:8px 0 20px;font-size:14px}
label{font-size:13px;color:#d4d4d8;display:block;margin-bottom:6px}
input,textarea{width:100%;background:#0f0f12;border:1px solid #2a2a30;border-radius:12px;color:#fff;padding:12px;font-size:15px;outline:none}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus{border-color:#a855f7}
.row{display:flex;gap:8px;align-items:center;margin:14px 0}
.row input{width:20px;height:20px;accent-color:#a855f7}
button{width:100%;background:linear-gradient(90deg,#a855f7,#ec4899);border:none;color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:12px;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin-top:12px;text-align:center;font-size:14px;min-height:20px}
.links{display:flex;gap:10px;margin-top:16px}
.links a{flex:1;text-align:center;padding:10px;border-radius:10px;background:#26262c;color:#fff;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>💌 Menfess Angel</h1>
<p class="sub">Kirim menfess anonim ke @menfessangel. Menunggu approval admin.</p>
<label>Username X / Telegram (opsional)</label>
<input id="username" placeholder="@username kamu">
<label style="margin-top:14px">Isi Menfess</label>
<textarea id="text" placeholder="Tulis menfess kamu di sini..."></textarea>
<div class="row"><input type="checkbox" id="toX" checked><label style="margin:0">Post juga ke X @jogcorp</label></div>
<button id="btn" onclick="kirim()">Kirim Menfess 🚀</button>
<div id="msg"></div>
<div class="links"><a href="https://t.me/menfessangel" target="_blank">📢 Channel</a><a href="https://t.me/menfessangel_bot" target="_blank">🤖 Bot Telegram</a></div>
</div>
<script>
async function kirim(){
  const btn=document.getElementById('btn'), msg=document.getElementById('msg');
  const text=document.getElementById('text').value.trim();
  const username=document.getElementById('username').value.trim();
  const toX=document.getElementById('toX').checked;
  if(text.length<3){msg.style.color='#f87171';msg.textContent='Menfess minimal 3 huruf';return;}
  btn.disabled=true;btn.textContent='Mengirim...';msg.textContent='';
  try{
    const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,username,toX})});
    const j=await r.json();
    if(j.ok){msg.style.color='#4ade80';msg.textContent='✅ Terkirim! Menunggu approval admin';document.getElementById('text').value='';}
    else{msg.style.color='#f87171';msg.textContent='❌ '+(j.error||'Gagal kirim');}
  }catch(e){msg.style.color='#f87171';msg.textContent='❌ Gagal konek ke server, coba lagi';}
  btn.disabled=false;btn.textContent='Kirim Menfess 🚀';
}
</script>
</body>
</html>
